<!DOCTYPE html>
<html lang="fr">

<head>
    <title>Admin_DB</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/quiz.css">
    <meta charset="UTF-8">
</head>

<body class="c-hud">
    <div class="c-hud__inner"></div>

    <div  class="c-hud__content" >
        <h1> AniGame__Database </h1>

<!--        &lt;!&ndash; PLACEHOLDERS &ndash;&gt;-->
<!--        <h2>La base de donnée est pas encore au point, mais ça taff dur</h2>-->
<!--        <img id="bonk" src="../img/bonk.gif" width="524">-->

        <!-- CA TAFF DUR ICI LA TABARNAK DE COLIS -->

        <div>
            <button class="nav-btn" onclick="toLauncher();">
                <img class="icon" src="../img/fleche-gauche.png" alt="fleche gauche">Retour au<br>Launcher
            </button>
        </div>
        <div id="login-form">
            <input id="username" type="text" placeholder="Nom d'utilisateur">
            <div id="password-wrapper">
                <input id="password" type="password" placeholder="Mot de passe">
                <button id="toggle-password" onclick="togglePassword()">👁</button>
            </div>
            <button class="nav-btn" onclick="login()">Se connecter</button>
            <p id="login-error"></p>
        </div>

        <div id="DB_rec" style="display: none">
            <button class="nav-btn" onclick="openQuizMakerPrompt()">Créer/ Modifier un quiz</button>
            <div id="nav">
                <div>
                    <button class="nav-btn" onclick="ArriereMecreant()">
                        <img class="icon" src="../img/fleche-gauche.png"> ARRIEEEEEEEREEEEU MECREANNNT
                    </button>
                    <input id="search-bar" type="text" placeholder="Rechercher..." oninput="search()">
<!--                    <span id="index-status">Indexation...</span>-->

                    <button class="nav-btn" onclick="document.getElementById('file-input').click()">
                        <img class="icon" src="../img/plus.png"> Ajouter
                    </button>
                    <input id="file-input" type="file" style="display:none" multiple onchange="uploadFiles(this.files)">

                    <button class="nav-btn" id="delete-selected-btn" style="display:none" onclick="deleteSelected()">
                        🗑 Supprimer la sélection
                    </button>
                </div>
                <div id="breadcrumb"></div>
            </div>
            <div id="file-container">
                <table id="file-list">
                    <thead>
                    <tr>
                        <th style="width: 37%"><input type="checkbox" id="select-all" onclick="toggleSelectAll()"> Nom</th>
                        <th style="width: 12%">Type</th>
                        <th style="width: 12%">Taille</th>
                        <th style="width: 10%">Aperçu</th>
                        <th style="width: 18%">Modifié le</th>
                        <th style="width: 8%"></th>
                    </tr>
                    </thead>
                    <tbody id="file-body"></tbody>
                </table>
            </div>
        </div>

        <div id="preview-modal" style="display:none;">
            <div id="preview-backdrop" onclick="closePreview()"></div>
            <div id="preview-content">
                <button id="preview-close" onclick="closePreview()">✕</button>
                <div id="preview-wrapper">
                    <div id="preview-body"></div>
                    <div id="preview-metadata">
                        <h3>Infos</h3>
                        <label>Artiste</label>
                        <input type="text" id="meta-artiste" placeholder="Artiste...">
                        <label>Nom musique</label>
                        <input type="text" id="meta-nom-musique" placeholder="Nom de la musique...">
                        <label>Genre</label>
                        <input type="text" id="meta-genre" placeholder="Genre...">
                        <label>Année</label>
                        <input type="number" id="meta-annee" placeholder="Année...">
                        <label>Indice</label>
                        <input type="text" id="meta-indice" placeholder="Indice...">
                        <button id="meta-save" onclick="saveMetadata()">Sauvegarder</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="confirm-modal" style="display:none;">
            <div id="confirm-backdrop"></div>
            <div id="confirm-content">
                <p id="confirm-message"></p>
                <div id="confirm-buttons">
                    <button class="nav-btn" id="confirm-ok">Confirmer</button>
                    <button class="nav-btn" id="confirm-cancel">Annuler</button>
                </div>
            </div>
        </div>
        <!-- fin #DB_rec -->

        <div id="quiz-maker" style="display:none">
            <div id="qm-app">
                <div id="qm-topbar">
                    <button class="nav-btn" onclick="closeQuizMaker()">
                        <img class="icon" src="../img/fleche-gauche.png"> Retour
                    </button>
                    <span id="qm-filename">nouveau-quiz.json</span>
                    <div id="qm-topbar-right">
                        <button class="nav-btn" onclick="exportQuiz()">Exporter ↓</button>
                    </div>
                </div>
                <div id="qm-cols">
                    <div id="qm-sidebar">
                        <div id="qm-search-bar">
                            <input type="text" id="qm-search" placeholder="Rechercher..." oninput="qmSearch()">
                            <span id="qm-refresh" onclick="qmRefreshTree()">↻</span>
                        </div>
                        <div id="qm-tree"></div>
                    </div>
                    <div id="qm-center">
                        <div id="qm-neutral">
                            <button id="qm-plus-btn" onclick="qmShowTypePicker()">+</button>
                            <div id="qm-neutral-label">Nouvelle question</div>
                            <div id="qm-type-picker" style="display:none">
                                <button class="qm-type-opt" onclick="qmOpenForm('BlindTestQuestion')">
                                    <span class="qm-badge qm-bt">BT</span> Musique
                                </button>
                                <button class="qm-type-opt" onclick="qmOpenForm('ImagesQuestion')">
                                    <span class="qm-badge qm-im">IMG</span> Images ×4
                                </button>
                                <button class="qm-type-opt" onclick="qmOpenForm('QuoteQuestion')">
                                    <span class="qm-badge qm-qu">CIT</span> Citation
                                </button>
                            </div>
                        </div>
                        <div id="qm-form" style="display:none">
                            <div id="qm-form-typebar">
                                <span id="qm-form-badge"></span>
                                <span id="qm-editing-label"></span>
                            </div>
                            <div id="qm-form-body"></div>
                            <div id="qm-form-footer">
                                <button class="nav-btn" onclick="qmCancelForm()">Annuler</button>
                                <button class="nav-btn" id="qm-submit-btn" onclick="qmSubmitForm()">Ajouter à la liste →</button>
                            </div>
                        </div>
                    </div>
                    <div id="qm-list-col">
                        <div class="qm-col-hd">
                            <span>Questions</span>
                            <span id="qm-q-count"></span>
                        </div>
                        <div id="qm-list-body"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="qm-export-modal" style="display:none">
            <div id="qm-export-backdrop" onclick="closeExportModal()"></div>
            <div id="qm-export-content">
                <h3>Exporter le quiz</h3>
                <p>Nom du fichier</p>
                <input type="text" id="qm-export-name" placeholder="mon-quiz.json">
                <div id="qm-export-buttons">
                    <button class="nav-btn" onclick="exportLocal()">💾 Télécharger en local</button>
                    <button class="nav-btn" onclick="exportNextcloud()">☁️ Envoyer sur Nextcloud</button>
                </div>
                <button class="nav-btn" onclick="closeExportModal()">Annuler</button>
            </div>
        </div>
        <div id="quiz-name-modal" style="display:none">
            <div id="quiz-name-backdrop"></div>
            <div id="quiz-name-content">
                <div id="quiz-modal-tabs">
                    <button class="quiz-modal-tab active" onclick="switchQuizTab('create')">Nouveau quiz</button>
                    <button class="quiz-modal-tab" onclick="switchQuizTab('edit')">Modifier un quiz</button>
                </div>

                <div id="quiz-tab-create">
                    <h3>Nom du quiz</h3>
                    <input type="text" id="quiz-name-input" placeholder="nom du quiz">
                    <button class="nav-btn" onclick="confirmQuizName()">Créer →</button>
                </div>

                <div id="quiz-tab-edit" style="display:none">
                    <h3>Choisir un quiz</h3>
                    <div id="quiz-list-existing"></div>
                </div>

                <button class="nav-btn" onclick="document.getElementById('quiz-name-modal').style.display='none'">Annuler</button>
            </div>
        </div>
    </div>



</body>
<script type="text/javascript" src="../js/main.js"></script>
<script type="text/javascript" src="../js/edit.ts"></script>
<script type="text/javascript" src="../js/quiz.js"></script>
</html>
